<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Кресло</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    /* Делаем стильный темный фон на весь экран */
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #121212; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      font-family: sans-serif;
    }
    
    /* Делаем сам контейнер с 3D-моделью полностью прозрачным и невидимым для пользователя */
    model-viewer { 
      width: 100%; 
      height: 100%; 
      position: absolute;
      top: 0;
      left: 0;
      background-color: transparent;
      --poster-color: transparent; /* Убирает белый фон при загрузке */
    }

    /* Делаем одну большую акцентную кнопку для запуска камеры */
    .ar-button {
      position: relative;
      z-index: 10; /* Кнопка поверх всего */
      background-color: #ffffff; 
      color: #000000; 
      border-radius: 12px; 
      border: none; 
      padding: 18px 32px; 
      font-size: 18px; 
      font-weight: bold; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .ar-button:active {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="chair.glb" 
    ar 
    ar-modes="scene-viewer quick-look" 
    camera-controls="false" 
    shadow-intensity="1">
    
    <button slot="ar-button" class="ar-button">
      📷 Открыть камеру
    </button>
    
  </model-viewer>

</body>
</html>
