<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Прототип - Кресло</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #f4f4f9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      font-family: sans-serif;
    }
    /* Задаем размер окна с 3D моделью */
    model-viewer { 
      width: 100%; 
      height: 100%; 
      max-width: 600px; /* Ограничение для ПК, чтобы не было на весь экран */
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background-color: #ffffff;
    }
    /* Стили для кнопки "Посмотреть в AR" */
    .ar-button {
      background-color: #2b2b2b; 
      color: white; 
      border-radius: 20px; 
      border: none; 
      position: absolute; 
      bottom: 30px; 
      left: 50%; 
      transform: translateX(-50%); 
      padding: 12px 24px; 
      font-size: 16px; 
      font-weight: bold; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.3); 
      cursor: pointer;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="barber_chair.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1"
    auto-rotate>
    
    <button slot="ar-button" class="ar-button">
      Включить AR
    </button>
    
  </model-viewer>

</body>
