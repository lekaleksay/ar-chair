<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Прототип | Museum Dev Lab</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    /* Основной фон с радиальным градиентом для глубины */
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0d;
      background-image: radial-gradient(circle at 50% 0%, #2a2a2a 0%, #0d0d0d 80%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Стильная карточка по центру экрана */
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      max-width: 340px;
      width: 85%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    /* Надзаголовок-логотип */
    .logo {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #888888;
      margin-bottom: 12px;
      display: block;
    }

    h1 {
      font-size: 26px;
      margin: 0 0 12px 0;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 15px;
      color: #a0a0a0;
      line-height: 1.5;
      margin-bottom: 35px;
    }

    /* Ограничиваем вьюер, чтобы он не занимал экран, а держал только кнопку */
    model-viewer {
      width: 100%;
      height: 60px; 
      --poster-color: transparent;
      margin-bottom: 25px;
    }

    /* Главная кнопка AR */
    .ar-button {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      border-radius: 12px;
      border: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .ar-button:active {
      transform: scale(0.96);
      background-color: #e0e0e0;
    }

    /* Иконка в кнопке */
    .ar-button svg {
      width: 22px;
      height: 22px;
    }

    /* Ссылка назад в портфолио */
    .back-link {
      display: inline-block;
      color: #777777;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
    }

    .back-link:hover {
      color: #ffffff;
      border-bottom: 1px solid #ffffff;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="logo">Museum Dev Lab</span>
    <h1>AR-визуализация</h1>
    <p>Нажмите кнопку ниже, чтобы запустить камеру и разместить 3D-объект в реальном масштабе.</p>
    
    <model-viewer 
      src="chair.glb" 
      ar 
      ar-modes="scene-viewer quick-look" 
      camera-controls="false" 
      shadow-intensity="1"
      scale="0.75 0.75 0.75">
      
      <button slot="ar-button" class="ar-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        Открыть камеру
      </button>
      
    </model-viewer>

    <a href="https://museumdevlab.ru/" class="back-link">Вернуться в портфолио</a>
  </div>

</body>
</html>
